name: Generate GitHub Metrics

on:
  # Automatically run this every night to update your stats
  schedule: [{cron: "0 0 * * *"}]
  # Allow you to manually click a button to run it anytime
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and Commit Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          # Upgraded token to access all repositories and calculate languages
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_details: percentage
          config_theme: dark
